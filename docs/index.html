<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴스 훑기</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #dcdcdc;
    --chip-bg: #ededed;
    --accent: #0b57d0;
    --star: #d98c00;
    --bar-bg: rgba(250, 250, 250, 0.96);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --fg: #e6e6e6;
      --muted: #9a9a9a;
      --line: #333;
      --chip-bg: #262626;
      --accent: #8ab4f8;
      --star: #f2b544;
      --bar-bg: rgba(18, 18, 18, 0.96);
    }
  }
  * { box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
  }
  a { color: var(--accent); }

  /* 상단 고정 바 */
  #bar {
    position: sticky; top: 0; z-index: 10;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--line);
    padding: 8px 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  }
  #bar h1 { font-size: 1.1rem; margin: 0; }
  #bar .meta { color: var(--muted); font-size: 0.9rem; }
  #bar .spacer { flex: 1; }
  #bar button {
    min-height: 44px; min-width: 44px;
    padding: 0 14px;
    font: inherit; font-size: 1rem;
    color: var(--fg);
    background: var(--chip-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  #bar button:disabled { opacity: 0.5; cursor: default; }

  main { max-width: 720px; margin: 0 auto; padding: 8px 0 60px; }
  #status { padding: 16px 12px; color: var(--muted); }
  #status:empty { display: none; }

  /* 날짜 묶음 */
  .day-head {
    font-size: 1rem; font-weight: 600;
    padding: 12px 12px 4px;
    color: var(--muted);
  }
  details > summary.day-head { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  details > summary.day-head::marker { color: var(--muted); }

  /* 한 줄 */
  .row {
    display: flex; align-items: flex-start; gap: 6px;
    padding: 10px 8px 10px 12px;
    border-top: 1px solid var(--line);
  }
  .row.overlap {
    border-left: 4px solid var(--accent);
    padding-left: 8px;
  }
  .row.overlap .title { font-weight: 700; }
  .body { flex: 1; min-width: 0; }
  .title {
    display: block;
    font-size: 1.05rem;
    color: var(--fg);
    text-decoration: none;
    word-break: break-word;
  }
  .title:visited { color: var(--muted); }
  .meta {
    margin-top: 4px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    font-size: 0.85rem; color: var(--muted);
  }
  .chip {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    background: var(--chip-bg);
  }
  .overlap .chip { border: 1px solid var(--muted); }
  .overlap-mark { font-weight: 700; }
  .hn { text-decoration: none; white-space: nowrap; }
  .id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.8rem; opacity: 0.8; margin-left: auto; }

  .star {
    flex: none;
    width: 44px; height: 44px;
    margin-top: -6px;
    font-size: 1.5rem; line-height: 1;
    color: var(--muted);
    background: none; border: 0; border-radius: 8px;
    cursor: pointer;
  }
  .star[aria-pressed="true"] { color: var(--star); }
</style>
</head>
<body>
<header id="bar">
  <h1>뉴스 훑기</h1>
  <span class="meta" id="collected"></span>
  <span class="spacer"></span>
  <span class="meta" id="star-count">별표 0개</span>
  <button type="button" id="copy">복사</button>
  <button type="button" id="clear">비우기</button>
</header>
<main>
  <p id="status"></p>
  <div id="list"></div>
</main>
<script>
(function () {
  'use strict';
  var STAR_KEY = 'news-stars';
  var items = [];
  var byId = {};
  var stars = loadStars();

  var $status = document.getElementById('status');
  var $list = document.getElementById('list');
  var $collected = document.getElementById('collected');
  var $starCount = document.getElementById('star-count');
  var $copy = document.getElementById('copy');
  var $clear = document.getElementById('clear');

  function loadStars() {
    try {
      var raw = localStorage.getItem(STAR_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }
  function saveStars() {
    try { localStorage.setItem(STAR_KEY, JSON.stringify(Array.from(stars))); } catch (e) {}
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function dayKey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  var WEEKDAY = ['일', '월', '화', '수', '목', '금', '토'];
  function dayLabel(key, d) {
    var now = new Date();
    var today = dayKey(now);
    var yesterday = dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
    var md = (d.getMonth() + 1) + '/' + d.getDate() + ' (' + WEEKDAY[d.getDay()] + ')';
    if (key === today) return '오늘 ' + md;
    if (key === yesterday) return '어제 ' + md;
    return md;
  }
  function isRecent(key) {
    var now = new Date();
    return key === dayKey(now) || key === dayKey(new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1));
  }

  function agoText(iso) {
    var t = new Date(iso).getTime();
    if (isNaN(t)) return '수집 시각 알 수 없음';
    var min = Math.floor((Date.now() - t) / 60000);
    if (min < 1) return '마지막 수집 방금';
    if (min < 60) return '마지막 수집 ' + min + '분 전';
    if (min < 24 * 60) return '마지막 수집 ' + Math.floor(min / 60) + '시간 전';
    var d = new Date(t);
    return '마지막 수집 ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function renderRow(item) {
    var overlap = item.sources.length >= 2;
    var row = el('div', 'row' + (overlap ? ' overlap' : ''));
    row.dataset.id = item.id;

    var star = el('button', 'star');
    star.type = 'button';
    star.dataset.id = item.id;
    setStar(star, stars.has(item.id), item.title);
    star.addEventListener('click', function () {
      if (stars.has(item.id)) stars.delete(item.id); else stars.add(item.id);
      saveStars();
      setStar(star, stars.has(item.id), item.title);
      updateStarCount();
    });
    row.appendChild(star);

    var body = el('div', 'body');
    var a = el('a', 'title', item.title);
    a.href = item.url; a.target = '_blank'; a.rel = 'noopener';
    body.appendChild(a);

    var meta = el('div', 'meta');
    if (overlap) meta.appendChild(el('span', 'overlap-mark', '겹침 ×' + item.sources.length));
    item.sources.forEach(function (s) { meta.appendChild(el('span', 'chip', s)); });
    if (item.hn) {
      var hn = el('a', 'hn', 'HN ↑' + item.hn.points + ' 💬' + item.hn.comments);
      hn.href = 'https://news.ycombinator.com/item?id=' + encodeURIComponent(item.hn.id);
      hn.target = '_blank'; hn.rel = 'noopener';
      meta.appendChild(hn);
    }
    if (typeof item.score === 'number') meta.appendChild(el('span', 'score', '↑' + item.score));
    meta.appendChild(el('span', 'id', item.id));
    body.appendChild(meta);
    row.appendChild(body);
    return row;
  }

  function setStar(btn, on, title) {
    btn.textContent = on ? '★' : '☆';
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    btn.setAttribute('aria-label', (on ? '별표 해제: ' : '별표: ') + title);
  }

  function updateStarCount() {
    $starCount.textContent = '별표 ' + stars.size + '개';
    $copy.disabled = stars.size === 0;
    $clear.disabled = stars.size === 0;
  }

  function render() {
    $list.textContent = '';
    if (!items.length) { $status.textContent = '아직 수집된 글이 없습니다.'; return; }
    $status.textContent = '';

    // 로컬 날짜별 묶음. 파일 순서 유지.
    var groups = {};
    var keys = [];
    items.forEach(function (it) {
      var d = new Date(it.firstSeenAt);
      var k = dayKey(d);
      if (!groups[k]) { groups[k] = { date: d, items: [] }; keys.push(k); }
      groups[k].items.push(it);
    });
    keys.sort().reverse();

    keys.forEach(function (k) {
      var g = groups[k];
      var label = dayLabel(k, g.date) + ' · ' + g.items.length + '건';
      var container, head;
      if (isRecent(k)) {
        container = el('section', 'day');
        head = el('h2', 'day-head', label);
        container.appendChild(head);
      } else {
        container = el('details', 'day');
        head = el('summary', 'day-head', label);
        container.appendChild(head);
      }
      container.dataset.day = k;
      g.items.forEach(function (it) { container.appendChild(renderRow(it)); });
      $list.appendChild(container);
    });
  }

  function starLines() {
    var lines = [];
    items.forEach(function (it) {
      if (stars.has(it.id)) lines.push(it.id + '  ' + it.title + '  ' + it.url);
    });
    // 이번 목록에서 빠진 옛 별표는 id 만
    stars.forEach(function (id) { if (!byId[id]) lines.push(id); });
    return lines.join('\n');
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(function () { return copyFallback(text); });
    }
    return Promise.resolve().then(function () { return copyFallback(text); });
  }
  function copyFallback(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = typeof document.execCommand === 'function' && document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    if (!ok) throw new Error('copy failed');
  }

  $copy.addEventListener('click', function () {
    var text = starLines();
    var orig = $copy.textContent;
    copyText(text).then(function () { $copy.textContent = '복사됨'; },
      function () { $copy.textContent = '복사 실패'; window.prompt('직접 복사하세요', text); })
      .then(function () { setTimeout(function () { $copy.textContent = orig; }, 1500); });
  });

  $clear.addEventListener('click', function () {
    if (!window.confirm('별표 ' + stars.size + '개를 모두 지울까요?')) return;
    stars.clear();
    saveStars();
    updateStarCount();
    render();
  });

  updateStarCount();
  $status.textContent = '불러오는 중…';
  fetch('./data/items.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (data) {
      items = Array.isArray(data.items) ? data.items : [];
      byId = {};
      items.forEach(function (it) { byId[it.id] = it; });
      $collected.textContent = agoText(data.generatedAt);
      render();
      updateStarCount();
    })
    .catch(function (err) {
      $status.textContent = '목록을 불러오지 못했습니다. (' + (err && err.message ? err.message : err) + ')';
    });
})();
</script>
</body>
</html>
